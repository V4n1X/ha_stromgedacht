name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned:
    name: Pinned Home Assistant
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements_test.txt"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest

  latest:
    # Catches breaking changes of new Home Assistant releases early
    name: Latest Home Assistant
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
      - run: pip install --upgrade pytest-homeassistant-custom-component
      - run: python -m pytest
